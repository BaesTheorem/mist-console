<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MIST</title>
<!-- Match the console's chosen theme + font.
     The overlay usually renders in the hotkey agent's WKWebView, a different
     process with its own storage, so localStorage is normally empty here and the
     SERVER injection is what actually themes it: app.py's /quickbox.html rewrites
     the data-theme attribute above, the "terminal" fallback below, and __mistFont
     from the on-disk settings before serving. localStorage is kept as the path for
     when this page is loaded inside the console's own WebView (the Windows port). -->
<script>window.__mistFont=null;</script>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||"terminal"}catch(e){document.documentElement.dataset.theme="terminal"}
try{var _d=document.documentElement,_fs=localStorage.getItem("fontStack");
if(!_fs&&window.__mistFont)_fs=window.__mistFont.stack;
if(_fs)_d.style.setProperty("--q-font",_fs);}catch(e){}</script>
<!-- the console's Material token layer: every theme's palette, shape scale and
     body face live here, so this overlay follows the theme instead of keeping a
     hand-maintained copy of it -->
<link rel="stylesheet" href="md-tokens.css">
<!-- the vendored faces, so a picked font also paints the quick-entry overlay -->
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* --q-* are thin aliases onto the console's MD3 roles, NOT a second palette.
     This used to be two hand-written blocks of literal colors, which is why the
     overlay drifted out of the theme: the console's tokens moved and these
     didn't. Adding a theme now means adding its tokens to md-tokens.css and
     nothing else — the overlay follows for free. Fallbacks are the terminal
     values, so the box still paints if the token sheet ever fails to load. */
  :root {
    --q-acc:   var(--md-sys-color-primary, #38dbdb);              /* accent + summon glow */
    --q-vio:   var(--mist-ext-thinking, #9b8cff);                 /* secondary: target chip, "new chat" */
    --q-bg:    var(--md-sys-color-surface-container-low, #121c28);/* the console's own panel ground */
    --q-text:  var(--md-sys-color-on-surface, #d9e3f4);
    --q-text2: var(--md-sys-color-on-surface-variant, #b8c8de);
    --q-dim:   var(--md-sys-color-outline, #8392a7);
    --q-err:   var(--md-sys-color-error, #ffb4ab);
    --q-font:  var(--mist-font-body, "SF Mono", "JetBrains Mono", Menlo, monospace);
    /* shape rides the MD3 scale: square in terminal, soft in solarpunk */
    --q-r-lg: var(--md-sys-shape-corner-large, 0px);
    --q-r-md: var(--md-sys-shape-corner-small, 0px);
    --q-r-sm: var(--md-sys-shape-corner-extra-small, 0px);
  }
  html, body {
    margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: var(--q-font);
  }
  /* box is bottom-anchored so the picker can open upward without shifting the
     input, and so the glow below it runs off the bottom edge of the screen */
  .wrap { height: 100%; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 16px; box-sizing: border-box; }
  .box {
    position: relative;
    width: 600px; box-sizing: border-box; padding: 14px 18px;
    display: flex; flex-direction: column;
    background: color-mix(in srgb, var(--q-bg) 94%, transparent);
    border: 1px solid color-mix(in srgb, var(--q-acc) 65%, transparent);
    border-radius: var(--q-r-lg);
    /* Long, low-alpha tail so the glow dissolves into the transparent panel
       (which is sized to hold it — see desktop.py QW/QH) instead of hitting a
       hard clipped edge. Each layer is fainter and wider than the last. */
    box-shadow:
      0 0 40px 4px color-mix(in srgb, var(--q-acc) 42%, transparent),
      0 0 110px 22px color-mix(in srgb, var(--q-acc) 18%, transparent),
      0 0 220px 70px color-mix(in srgb, var(--q-acc) 8%, transparent),
      0 0 360px 150px color-mix(in srgb, var(--q-acc) 3.5%, transparent),
      inset 0 0 22px color-mix(in srgb, var(--q-acc) 8%, transparent);
    animation: breathe 3.4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { box-shadow:
      0 0 40px 4px color-mix(in srgb, var(--q-acc) 42%, transparent),
      0 0 110px 22px color-mix(in srgb, var(--q-acc) 18%, transparent),
      0 0 220px 70px color-mix(in srgb, var(--q-acc) 8%, transparent),
      0 0 360px 150px color-mix(in srgb, var(--q-acc) 3.5%, transparent),
      inset 0 0 22px color-mix(in srgb, var(--q-acc) 8%, transparent); }
    50% { box-shadow:
      0 0 52px 7px color-mix(in srgb, var(--q-acc) 50%, transparent),
      0 0 140px 30px color-mix(in srgb, var(--q-acc) 22%, transparent),
      0 0 270px 90px color-mix(in srgb, var(--q-acc) 10%, transparent),
      0 0 430px 180px color-mix(in srgb, var(--q-acc) 5%, transparent),
      inset 0 0 26px color-mix(in srgb, var(--q-acc) 12%, transparent); }
  }
  .row { display: flex; align-items: center; gap: 14px; }
  .glyph { height: 26px; width: auto; display: block; filter: drop-shadow(0 0 8px color-mix(in srgb, var(--q-acc) 70%, transparent)); }
  input.q {
    flex: 1; min-width: 0; background: transparent; border: none; outline: none;
    color: var(--q-text); font-size: 18px; font-family: inherit; caret-color: var(--q-acc);
  }
  input.q::placeholder { color: var(--q-dim); }
  .ab {
    background: transparent; border: 1px solid color-mix(in srgb, var(--q-acc) 30%, transparent); border-radius: var(--q-r-md);
    color: var(--q-text2); font-size: 15px; line-height: 1; padding: 6px 8px; cursor: pointer;
  }
  .ab:hover, .ab.on { border-color: var(--q-acc); background: color-mix(in srgb, var(--q-acc) 14%, transparent); }
  /* monochrome inline-SVG glyph (e.g. the link button), tinted to match the text glyphs */
  .ab svg { width: 16px; height: 16px; display: block; fill: currentColor; }
  .chips { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .chips:empty { display: none; }
  .chip {
    font-size: 12px; color: var(--q-text2); background: color-mix(in srgb, var(--q-acc) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--q-acc) 40%, transparent); border-radius: var(--q-r-sm); padding: 3px 9px;
    display: flex; align-items: center; gap: 7px; max-width: 320px;
  }
  .chip.target { background: color-mix(in srgb, var(--q-vio) 12%, transparent); border-color: color-mix(in srgb, var(--q-vio) 55%, transparent); color: var(--q-text2); }
  .chip .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .x { cursor: pointer; color: var(--q-dim); }
  .chip .x:hover { color: var(--q-err); }

  /* conversation picker — opens upward, above the box */
  .picker {
    position: absolute; left: 0; right: 0; bottom: calc(100% + 12px);
    box-sizing: border-box; padding: 10px;
    background: color-mix(in srgb, var(--q-bg) 97%, transparent);
    border: 1px solid color-mix(in srgb, var(--q-acc) 50%, transparent); border-radius: var(--q-r-lg);
    box-shadow: 0 0 30px 4px color-mix(in srgb, var(--q-acc) 22%, transparent),
                0 0 70px 18px color-mix(in srgb, var(--q-acc) 10%, transparent);
  }
  .picker[hidden] { display: none; }
  .picker .psearch {
    width: 100%; box-sizing: border-box; padding: 8px 11px;
    background: color-mix(in srgb, var(--q-acc) 6%, transparent);
    border: 1px solid color-mix(in srgb, var(--q-acc) 30%, transparent);
    border-radius: var(--q-r-md); color: var(--q-text); font-size: 14px; font-family: inherit;
    caret-color: var(--q-acc); outline: none;
  }
  .picker .psearch::placeholder { color: var(--q-dim); }
  .picker .phint { color: var(--q-dim); font-size: 11px; padding: 8px 4px 2px; }
  .picker .plist { margin-top: 6px; max-height: 270px; overflow-y: auto; }
  .pi {
    display: flex; align-items: center; gap: 9px;
    padding: 8px 10px; border-radius: var(--q-r-sm); cursor: pointer;
    color: var(--q-text2); font-size: 14px; white-space: nowrap;
  }
  .pi:hover, .pi.sel { background: color-mix(in srgb, var(--q-acc) 16%, transparent); color: var(--q-text); }
  .pi .glyph-i { flex: 0 0 auto; color: var(--q-acc); width: 14px; text-align: center; }
  .pi .glyph-i svg { width: 13px; height: 13px; fill: currentColor; vertical-align: -2px; }
  .pi .pt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .pi.new .glyph-i { color: var(--q-vio); }
  .picker .pempty { color: var(--q-dim); font-size: 13px; padding: 10px; text-align: center; }
  .picker .plist::-webkit-scrollbar { width: 8px; }
  .picker .plist::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--q-acc) 30%, transparent); border-radius: var(--q-r-sm); }

  /* Solarpunk: gilded Art Nouveau flourishes spilling over the summon box's top
     corners (genuine public-domain art — see ART-CREDITS.md) */
  html[data-theme="solarpunk"] .box { overflow: visible; }
  /* sit ENTIRELY above the box (bottom edge ~6px into the top border) so the art
     never overlaps the input row, which lives near the top of the box */
  html[data-theme="solarpunk"] .box::before,
  html[data-theme="solarpunk"] .box::after {
    content: ""; position: absolute; bottom: calc(100% - 6px); width: 172px; height: 74px;
    background-image: url("an-flourish.svg"); background-repeat: no-repeat; background-size: contain;
    pointer-events: none; z-index: 5; opacity: .9;
  }
  /* top-left: flip vertical so the spray grows up out of the corner */
  html[data-theme="solarpunk"] .box::before { left: -14px; background-position: left bottom; transform: scaleY(-1); }
  /* top-right: mirror it */
  html[data-theme="solarpunk"] .box::after  { right: -14px; background-position: right bottom; transform: scale(-1,-1); }
</style>
</head>
<body>
<div class="wrap">
  <div class="box">
    <div class="picker" id="picker" hidden>
      <input id="psearch" class="psearch" type="text" autocomplete="off" spellcheck="false"
             placeholder="Find a conversation…  (↑↓ choose · ⏎ pick · Esc back)">
      <div class="plist" id="plist"></div>
    </div>
    <div class="row">
      <img class="glyph" src="mist-logo.png" alt="MIST">
      <input id="q" class="q" type="text" autocomplete="off" spellcheck="false"
             placeholder="Ask MIST…  (Enter to send · Esc to dismiss)">
      <button class="ab" id="pickBtn" title="Send into an existing conversation" onmousedown="event.preventDefault()">⤷</button>
      <button class="ab" id="shotBtn" title="Attach a screenshot selection" onmousedown="event.preventDefault()">⛶</button>
      <button class="ab" id="urlBtn" title="Attach the current page URL" onmousedown="event.preventDefault()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg></button>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</div>
<script>
  const input = document.getElementById("q");
  const chipsEl = document.getElementById("chips");
  const picker = document.getElementById("picker");
  const pickSearch = document.getElementById("psearch");
  const plist = document.getElementById("plist");
  let attachedShot = null;   // local file path (set by native)
  let attachedUrl = null;
  let targetSid = null;      // null = start a new chat
  let targetTitle = null;

  let pickItems = [];        // currently shown {id,title,pinned,_new}
  let pickIdx = 0;
  let sessionsCache = [];

  function esc(s) { return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }
  function host(u) { try { return new URL(u).host || u; } catch (_) { return u; } }

  function renderChips() {
    chipsEl.innerHTML = "";
    document.getElementById("shotBtn").classList.toggle("on", !!attachedShot);
    document.getElementById("urlBtn").classList.toggle("on", !!attachedUrl);
    document.getElementById("pickBtn").classList.toggle("on", !!targetSid);
    if (targetSid) {
      const c = addChip("⤷ " + (targetTitle || "conversation"),
        () => { targetSid = null; targetTitle = null; renderChips(); input.focus(); });
      c.classList.add("target");
    }
    if (attachedShot) addChip("⛶ Screenshot", () => { attachedShot = null; renderChips(); input.focus(); });
    if (attachedUrl) addChip("🔗 " + host(attachedUrl), () => { attachedUrl = null; renderChips(); input.focus(); });
  }
  function addChip(label, onRemove) {
    const c = document.createElement("div"); c.className = "chip";
    const t = document.createElement("span"); t.className = "t"; t.textContent = label; c.appendChild(t);
    const x = document.createElement("span"); x.className = "x"; x.textContent = "×";
    x.addEventListener("click", onRemove); c.appendChild(x);
    chipsEl.appendChild(c);
    return c;
  }
  function reset() {
    input.value = ""; attachedShot = null; attachedUrl = null;
    targetSid = null; targetTitle = null;
    closePicker(); renderChips();
  }

  // called by the native panel after it captures
  window.__attachShot = (path) => { attachedShot = path || null; renderChips(); input.focus(); };
  window.__attachUrl = (url) => { attachedUrl = url || null; renderChips(); input.focus(); };
  // called by the native panel when the overlay is (re)shown
  window.__qfocus = () => { (picker.hidden ? input : pickSearch).focus(); };

  // bridge to the native panel (WKWebView message handler), with a pywebview fallback
  function signal(action) {
    try {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.mist) {
        window.webkit.messageHandlers.mist.postMessage(action);
      } else if (window.pywebview && window.pywebview.api) {
        if (action === "surface") window.pywebview.api.surface();
        else if (action === "dismiss") window.pywebview.api.dismiss();
        else if (action === "expand" && window.pywebview.api.expand) window.pywebview.api.expand();
        else if (action === "collapse" && window.pywebview.api.collapse) window.pywebview.api.collapse();
        // screenshot/url have no fallback outside the native macOS panel
      }
    } catch (_) {}
  }

  /* ---------- conversation picker ---------- */
  async function openPicker() {
    if (!picker.hidden) return;
    picker.hidden = false;
    signal("expand");                 // grow the native panel upward
    pickSearch.value = "";
    try {
      const list = await (await fetch("/sessions")).json();
      sessionsCache = list.sort((a, b) =>
        (a.pinned !== b.pinned) ? (a.pinned ? -1 : 1) : (b.last_activity - a.last_activity));
    } catch (_) { sessionsCache = []; }
    renderPickList("");
    pickSearch.focus();
  }
  function closePicker() {
    if (picker.hidden) return;
    picker.hidden = true;
    signal("collapse");               // shrink the panel back down
  }
  function renderPickList(q) {
    q = (q || "").toLowerCase().trim();
    const matches = sessionsCache.filter((s) => (s.title || "").toLowerCase().includes(q));
    pickItems = [{ id: null, title: "New chat", _new: true }].concat(matches).slice(0, 9);
    pickIdx = 0;
    plist.innerHTML = "";
    pickItems.forEach((s, i) => {
      const row = document.createElement("div");
      row.className = "pi" + (s._new ? " new" : "") + (i === pickIdx ? " sel" : "");
      const g = document.createElement("span"); g.className = "glyph-i";
      if (s._new) g.textContent = "＋";
      else if (s.pinned) g.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg>';
      else g.textContent = "▸";
      const t = document.createElement("span"); t.className = "pt"; t.textContent = s.title || "New chat";
      row.appendChild(g); row.appendChild(t);
      row.addEventListener("mousedown", (e) => { e.preventDefault(); choosePick(i); });
      row.addEventListener("mouseenter", () => { pickIdx = i; paintPickSel(); });
      plist.appendChild(row);
    });
    if (!matches.length && q) {
      const e = document.createElement("div"); e.className = "pempty";
      e.textContent = "No match · ⏎ starts a new chat"; plist.appendChild(e);
    }
  }
  function paintPickSel() {
    [...plist.querySelectorAll(".pi")].forEach((r, i) => r.classList.toggle("sel", i === pickIdx));
  }
  function choosePick(i) {
    const s = pickItems[i];
    if (!s) return;
    targetSid = s._new ? null : s.id;
    targetTitle = s._new ? null : s.title;
    closePicker();
    renderChips();
    input.focus();
  }

  document.getElementById("pickBtn").addEventListener("click", () => {
    if (picker.hidden) openPicker(); else closePicker();
  });
  pickSearch.addEventListener("input", () => renderPickList(pickSearch.value));
  pickSearch.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); pickIdx = Math.min(pickIdx + 1, pickItems.length - 1); paintPickSel(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); pickIdx = Math.max(pickIdx - 1, 0); paintPickSel(); }
    else if (e.key === "Enter") { e.preventDefault(); choosePick(pickIdx); }
    else if (e.key === "Escape") { e.preventDefault(); closePicker(); input.focus(); }
  });

  /* ---------- main input ---------- */
  // keep focus on the input whenever the panel regains focus (the screenshot flow
  // hides+reshows the panel; never clear the typed text or chosen target)
  const refocus = () => { if (picker.hidden) input.focus(); else pickSearch.focus(); };
  window.addEventListener("focus", refocus);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refocus(); });
  window.addEventListener("pageshow", refocus);
  input.focus();

  document.getElementById("shotBtn").addEventListener("click", () => signal("screenshot"));
  document.getElementById("urlBtn").addEventListener("click", () => signal("url"));

  input.addEventListener("keydown", async (e) => {
    if (e.key === "ArrowDown" && picker.hidden && !input.value) {
      // open the picker from the input with ↓ when nothing's typed
      e.preventDefault(); openPicker(); return;
    }
    if (e.key === "Escape") {
      e.preventDefault();
      if (!picker.hidden) { closePicker(); input.focus(); return; }
      reset();
      signal("dismiss");
      return;
    }
    if (e.key === "Enter" && (input.value.trim() || attachedShot || attachedUrl || targetSid)) {
      e.preventDefault();
      const body = {
        text: input.value.trim(), screenshot: attachedShot, url: attachedUrl,
        session: targetSid,
      };
      reset();
      try {
        await fetch("/quick-new", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
      } catch (_) {}
      signal("surface");
    }
  });
</script>
</body>
</html>
