<!-- Clawd theme wordmark: the same original crab as clawd-wall.svg, inked for
     the top bar instead of for a watermark. Full-strength body coral, and the
     pupils go near-black rather than canvas-colored, because at 24px a pupil
     tuned to one surface disappears the moment the crab sits on another. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 15" shape-rendering="crispEdges">
  <g fill="#DE886D">
    <!-- eyes on stalks, leaning outward -->
    <rect x="9"  y="2" width="2" height="2"/>
    <rect x="17" y="2" width="2" height="2"/>
    <rect x="10" y="4" width="1" height="1"/>
    <rect x="17" y="4" width="1" height="1"/>

    <!-- carapace -->
    <rect x="10" y="5"  width="8"  height="1"/>
    <rect x="8"  y="6"  width="12" height="1"/>
    <rect x="6"  y="7"  width="16" height="1"/>
    <rect x="5"  y="8"  width="18" height="2"/>
    <rect x="6"  y="10" width="16" height="1"/>

    <!-- left claw: hinge, two prongs, and the arm back to the shell -->
    <rect x="4" y="5" width="1" height="3"/>
    <rect x="1" y="5" width="3" height="1"/>
    <rect x="1" y="7" width="3" height="1"/>
    <rect x="4" y="8" width="1" height="1"/>

    <!-- right claw, mirrored -->
    <rect x="23" y="5" width="1" height="3"/>
    <rect x="24" y="5" width="3" height="1"/>
    <rect x="24" y="7" width="3" height="1"/>
    <rect x="23" y="8" width="1" height="1"/>

    <!-- six legs, evenly spaced about the centre line, feet splayed outward -->
    <rect x="6"  y="11" width="1" height="2"/>
    <rect x="9"  y="11" width="1" height="2"/>
    <rect x="12" y="11" width="1" height="2"/>
    <rect x="15" y="11" width="1" height="2"/>
    <rect x="18" y="11" width="1" height="2"/>
    <rect x="21" y="11" width="1" height="2"/>
    <rect x="5"  y="13" width="1" height="1"/>
    <rect x="8"  y="13" width="1" height="1"/>
    <rect x="11" y="13" width="1" height="1"/>
    <rect x="16" y="13" width="1" height="1"/>
    <rect x="19" y="13" width="1" height="1"/>
    <rect x="22" y="13" width="1" height="1"/>
  </g>
  <g fill="#20100A">
    <rect x="10" y="3" width="1" height="1"/>
    <rect x="17" y="3" width="1" height="1"/>
  </g>
</svg>
