# XcodeGen spec: `xcodegen generate` writes MIST.xcodeproj (gitignored) from
# this file and the MIST/ tree. Anything set in the Xcode GUI is lost on the
# next generate, so signing lives in Config/Signing.xcconfig.
name: MIST
options:
  bundleIdPrefix: com.alexhedtke
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  MIST:
    type: application
    platform: iOS
    sources:
      - path: MIST/Sources
      - path: MIST/Resources
    info:
      path: MIST/Info.plist
      properties:
        CFBundleDisplayName: MIST
        CFBundleShortVersionString: "1.2"
        CFBundleVersion: "3"
        UILaunchScreen:
          UIColorName: LaunchBackground
        # The Console is a dark surface; keep the status bar and keyboard on it.
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # The Mac serves plain http on the LAN and behind a Tailscale name; the
        # only server this app ever talks to is the one it was paired with.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: MIST talks to the Console server running on your Mac over the local network.
        NSBonjourServices:
          - _http._tcp
        NSCameraUsageDescription: The camera reads the pairing QR code shown in the Console's settings on the Mac.
        CFBundleURLTypes:
          - CFBundleURLName: com.alexhedtke.mistconsole
            CFBundleURLSchemes: [mist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexhedtke.mistconsole
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_STRICT_CONCURRENCY: minimal
    dependencies:
      - target: MISTWidget   # the Lock Screen / Home Screen widgets, embedded as a plug-in

  # WidgetKit extension: "MIST" (opens the Console) and "MIST: new chat"
  # launchers in the Lock Screen circular / rectangular / inline forms and a
  # Home Screen small. No shared state with the app on purpose: an App Group
  # would add an entitlement to the signing story for a subtitle nobody needs.
  MISTWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MISTWidget/Sources
      - path: MISTWidget/Resources
    info:
      path: MISTWidget/Info.plist
      properties:
        CFBundleDisplayName: MIST
        CFBundleShortVersionString: "1.2"
        CFBundleVersion: "3"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alexhedtke.mistconsole.widget
        INFOPLIST_KEY_CFBundleDisplayName: MIST
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: WidgetBackground
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_STRICT_CONCURRENCY: minimal
